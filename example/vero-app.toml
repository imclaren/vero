# vero-app.toml describes a vero app to vero's packaging: what its
# installers and its install site need that isn't secret. Copy this one
# beside your app's go.mod and change it. Paths are relative to this file.
#
#   scripts/package.sh --app example/vero-app.toml --version 1.0.0
#   cd cmd/vero-repo && go run . build --app ../../example/vero-app.toml ...
#
# The README's "Creating app installers" section goes through it all.

# The package and command name: lower case letters, digits and hyphens.
name = "vero-example"
# What people see, in menus and on the install page.
display_name = "vero example"
# A reverse-domain name that's yours, which systems tell apps apart by.
id = "dev.vero.example"
# Usually given with --version instead, so that each release says its own.
version = "1.0.0"
summary = "Shows jobs running in a Go worker"
# A paragraph or two, for package managers and software centres. A blank
# line starts a new paragraph.
description = """
vero's example app. Its window shows three jobs that a Go worker runs,
with a Restart button for each, the phase each job is in, and how far
through it is.
"""
# Who publishes it, as "Name <email>". The Windows installer shows the name,
# and the Debian package names this as its maintainer.
publisher = "Example Publisher <you@example.com>"
homepage = "https://github.com/imclaren/vero"
# An SPDX licence identifier.
licence = "MIT"
# A square PNG, 512 or 1024 pixels.
icon = "icon.png"

[worker]
# The worker's main package, and the program's name (".exe" is added on
# Windows). The front ends start it from beside themselves by this name.
package = "worker"
name = "worker"

# The front end for Linux - the .deb, the rpm, the AUR package and a
# Flatpak - and for the BSDs and illumos.
[gtk]
folder = "gtk-app"
entry = "main.py"
# Files copied beside the entry: the Python binding, which the app imports.
include = ["../bindings/python/vero.py"]
# The menu categories, from freedesktop.org's list.
categories = "Utility;"

# What the Debian package needs from Debian, and where it's filed.
[gtk.deb]
depends = "python3 (>= 3.10), python3-gi, gir1.2-gtk-4.0"
section = "utils"

# What the rpm needs from Fedora and openSUSE. They name GTK 4 for Python
# differently, so this asks, in brackets, for openSUSE's on openSUSE and
# Fedora's everywhere else, as rpm lets a requirement depend on what's
# installed.
[gtk.rpm]
requires = "python3 >= 3.10, python3-gobject, (typelib(Gtk) = 4.0 if openSUSE-release else (gtk4 and gobject-introspection))"

# What the Arch Linux package needs from Arch.
[gtk.arch]
depends = "python, python-gobject, gtk4"

# A Flatpak, for any Linux. It's made only when asked for, with build =
# true or --targets flatpak, since making one needs Docker. The runtime it
# runs on comes from Flathub: GNOME's has GTK 4, WebKitGTK, Python and
# PyGObject. Leave these out for vero's default.
[gtk.flatpak]
build = false
runtime = "org.gnome.Platform"
runtime_version = "51"

# The BSDs and illumos. Each is packaged for when its section is here.
# python is the command that starts the app there, where python3 isn't
# one.
#
# FreeBSD and DragonFly: each package the app needs, with the port it
# comes from.
[gtk.freebsd]
deps = { python3 = "lang/python3", gtk4 = "x11-toolkits/gtk40", py312-pygobject = "devel/py-pygobject@py312" }

[gtk.dragonfly]
deps = { gtk4 = "x11-toolkits/gtk40", py311-pygobject = "devel/py-pygobject@py311" }
python = "python3.11"

# NetBSD and illumos use pkgsrc: what the app needs, as patterns.
[gtk.netbsd]
depends = ["gtk4-[0-9]*", "py312-gobject3-[0-9]*"]
python = "python3.12"

[gtk.illumos]
depends = ["gtk4-[0-9]*", "py312-gobject3-[0-9]*"]
python = "python3.12"

# OpenBSD: each package the app needs, as port:pattern:package.
[gtk.openbsd]
depends = ["x11/gtk+4:gtk+4-*:gtk+4-4.0", "devel/py-gobject3:py3-gobject3-*:py3-gobject3-3.0"]

# The front end for Windows: its project's folder, and the program it builds.
[wpf]
folder = "wpf-app"
exe = "VeroExample.exe"

# What the app asks of the system it runs on. Each installer turns these
# into what its system needs. On Windows, autostart offers to open the app
# at sign-in, and webview installs Microsoft Edge WebView2 where it's
# missing. A Flatpak may reach the network only with network, the home
# folder only with files, and the keyring only with keyring. A file chosen
# in a file dialog, notifications, and opening at sign-in all go through
# Flatpak's portals, which need nothing here.
[needs]
network = false
files = false
keyring = false
notifications = false
autostart = false
webview = false

# The Mac app: a SwiftPM package (product), or an Xcode project (project
# and scheme). prepare runs before each architecture is built, with GOARCH
# and CC set for it: here, it builds the C archive the app links. The
# worker goes in Contents/Resources, with any files resources lists. feed
# is where the app checks for updates, and sparkle_public_key the key it
# checks them with, which vero-repo key prints; both go in its Info.plist.
[macos]
folder = "menubar-app"
product = "MenuBarExample"
prepare = "CGO_ENABLED=1 go build -buildmode=c-archive -o libvero.a ../../cshim"
menubar = true
minimum = "13.0"

# The page in a browser: what its build makes, which the site serves.
[web]
folder = "web-app"
build = "./build.sh"
files = ["index.html", "main.wasm", "wasm_exec.js"]

# A terminal front end whose worker is one worker.wasm, run by wasmtime.
[wasi]
frontend = "wasi-app"
worker = "wasi-app/worker"

# The Android app: its build makes an aligned, unsigned .apk, which vero
# signs with your keystore (VERO_ANDROID_KEYSTORE), or one it makes and
# keeps beside your signing key. The build needs a JDK: Homebrew's openjdk
# is used unless JAVA_HOME says otherwise.
[android]
folder = "android-app"
build = "JAVA_HOME=${JAVA_HOME:-/opt/homebrew/opt/openjdk} PATH=$JAVA_HOME/bin:$PATH ./build.sh --build"
apk = ".build/app-aligned.apk"

# The iOS app: its build makes an app for the Simulator. An .ipa for the
# App Store is made only with your Apple account's identity and profile
# (VERO_IOS_IDENTITY and VERO_IOS_PROFILE), from the app device_app names.
[ios]
folder = "ios-app"
build = "./build.sh --build"
simulator_app = ".build/VeroExample.app"

# Plan 9: the front end is a Go program that finds the worker beside it.
[plan9]
frontend = "plan9-app"
arches = ["amd64", "386"]
